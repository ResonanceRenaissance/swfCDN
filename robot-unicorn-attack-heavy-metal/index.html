
<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <style>
            body, html {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
            }
            #ruffle {
                width: 100%;
                height: 100%;
            }
        </style>
    </head>
    <body>
        <div id="ruffle"></div>
        <script src="https://unpkg.com/@ruffle-rs/ruffle"></script>
<script>
const ruffle = window.RufflePlayer.newest();
const player = ruffle.createPlayer();

document.getElementById("ruffle").appendChild(player);
player.style.width = "100%";
player.style.height = "100%";

player.load({
  url: "https://cdn.jsdelivr.net/gh/ResonanceRenaissance/swfCDN@main/robot-unicorn-attack-heavy-metal/ruahm.swf"
});
</script>
    </body>
</html>
